name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: |
            ./rust -> target
            ./rust/patches/aes-gcm-stream -> target

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format

      - name: Ensure no changed files
        run: git diff --exit-code

      - name: Publint
        run: pnpm dlx publint

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-and-wasm
          path: |
            dist/
            wasm/

  test:
    needs: build
    strategy:
      matrix:
        include:
          - test_name: rust
            test_command: pnpm run test:rust:ci
            needs_fixtures: false
            needs_rust: true
            needs_playwright: false
          - test_name: js and fixtures
            test_command: pnpm run test:js:ci && pnpm run test:fixtures:ci
            needs_fixtures: true
            needs_rust: false
            needs_playwright: true

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Setup Rust
        if: ${{ matrix.needs_rust }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: |
            ./rust -> target
            ./rust/patches/aes-gcm-stream -> target

      - name: Install Playwright browsers
        if: ${{ matrix.needs_playwright }}
        run: pnpm exec playwright install --with-deps

      - name: Rebuild fixtures
        if: ${{ matrix.needs_fixtures }}
        run: pnpm run rebuild-fixtures

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-and-wasm
          path: .

      - name: Run tests (${{ matrix.test_name }})
        run: ${{ matrix.test_command }}

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - build
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-and-wasm
          path: .

      - name: Ensure no changed files
        run: git diff --exit-code

      - name: Publish to npm
        run: pnpm publish --provenance
