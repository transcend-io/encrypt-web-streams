name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache rust target directory
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Build
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-and-wasm
          path: |
            dist/
            wasm/

  test:
    needs: build
    strategy:
      matrix:
        include:
          - test_name: rust
            test_command: pnpm run test:rust:ci
            needs_fixtures: false
            needs_rust: true
            needs_playwright: false
          - test_name: js and fixtures
            test_command: pnpm run test:js:ci && pnpm run test:fixtures:ci
            needs_fixtures: true
            needs_rust: false
            needs_playwright: true

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Setup Rust
        if: ${{ matrix.needs_rust }}
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore rust target cache
        if: ${{ matrix.needs_rust }}
        uses: actions/cache@v4
        with:
          path: rust/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Playwright browsers
        if: ${{ matrix.needs_playwright }}
        run: pnpm dlx playwright install --with-deps

      - name: Rebuild fixtures
        if: ${{ matrix.needs_fixtures }}
        run: pnpm run rebuild-fixtures

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-and-wasm
          path: .

      - name: Run tests (${{ matrix.test_name }})
        run: ${{ matrix.test_command }}

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-and-wasm
          path: .

      - name: Configure npm authentication
        run: |
          pnpm config set always-auth true
          pnpm config set //registry.npmjs.org/:_authToken "${{ secrets.NPM_TOKEN }}"

      - name: Ensure no changed files
        run: git diff --exit-code

      - name: Publish to npm
        run: pnpm publish

      - name: Configure GitHub Packages authentication
        run: |
          pnpm config set always-auth true
          pnpm config set registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish to GitHub Packages
        run: pnpm publish
